name: Update RSS Feed

on:
  schedule:
    - cron: '0 */6 * * *' # Jalan tiap 6 jam
  workflow_dispatch: # Bisa run manual

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true # Biar install berikutnya lebih cepet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync # Ini bakal install semua yang ada di pyproject.toml / uv.lock

      - name: Run scraper
        run: uv run main.py # Menjalankan script pake environment uv

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add output.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update RSS feed: $(date)" && git push)
