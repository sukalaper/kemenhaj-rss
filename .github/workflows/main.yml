name: Update RSS Feed

on:
  push:
    branches: ["main"]
  schedule:
    # Run every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  update-rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Izin mutlak buat push perubahan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 penting biar rebase nggak bingung
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright Chromium
        # Ini solusi buat error 'Executable doesn't exist' lo tadi
        run: uv run playwright install chromium --with-deps

      - name: Run RSS feed generator
        run: uv run python main.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 1. Simpan perubahan output.xml ke 'lemari' sementara (stash)
          git stash
          
          # 2. Tarik update terbaru dari main biar sinkron
          git pull --rebase origin main
          
          # 3. Ambil lagi perubahan output.xml tadi
          git stash pop || echo "Gak ada yang perlu dipop"
          
          # 4. Baru deh add, commit, dan push
          git add output.xml
          if ! git diff --staged --quiet; then
            git commit -m "Update RSS feed [skip ci]"
            git push origin main
          else
            echo "No changes to commit"
          fi
